<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="2" intercept="-.5"/>
      <feFuncG type="linear" slope="2" intercept="-.5"/>
      <feFuncB type="linear" slope="2" intercept="-.5"/>
      <feFuncA type="table" tableValues="0 .48"/>
    </feComponentTransfer>
  </filter>
  <rect width="160" height="160" filter="url(#paper)"/>
</svg>
